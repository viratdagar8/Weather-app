<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtmoWeather</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-title">
      <h1>AtmoWeather</h1>
      <p>"A Modern Weather Forecasting Web Application"</p>
    </div>

    <ul class="navbar">
      <li class="nav-item">
        <a class="nav-link" href="#" id="radarMapBtn">RADAR</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>
      <!-- Profile page -->
      <li class="Profile-item">
        <a class="profile-link" href="login.html" id="profileBtn">
          <i class="fa-regular fa-circle-user"></i>
        </a>
      </li>
      <!-- Dark mode -->
      <li class="nav-item"></li>
      <li class="theme-item">
        <button id="themeToggle" class="theme-btn">🌙 Dark</button>
      </li>
    </ul>

    <div class="background">
      <div id="mapSection">
        <h2>Weather Radar</h2>
        <button id="closeMap">X</button>
        <div id="map"></div>
        <div class="radar-controls">
          <button id="playRadar">▶ Play</button>
          <button id="pauseRadar">⏸ Pause</button>

          <input type="range" id="radarTimeline" min="0" value="0" step="1" />

          <span id="radarTime">Radar</span>
        </div>
        <div class="radar-legend">
          <h4>Precipitation</h4>
          <div class="radar-legend">
            <div class="color-bar"></div>

            <div class="legend-labels">
              <span>Light</span>
              <span>Moderate</span>
              <span>Heavy</span>
            </div>
          </div>
        </div>

        <p class="radar-credit">Weather data by RainViewer</p>
      </div>

      <div class="card">
        <div class="search">
          <input type="text" placeholder="Enter city name" spellcheck="false" />
          <button><img src="images/search.png" alt="Search icon" /></button>
        </div>
        <div class="error">
          <h2>City Not Found</h2>
        </div>
        <div class="weather">
          <img src="images/rain.png" class="weather-icon" alt="" />
          <h1 class="temp">22</h1>
          <h2 class="city">Delhi</h2>
          <div class="details">
            <div class="col">
              <img src="images/humidity.png" alt="" />
              <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
              </div>
            </div>
            <div class="col">
              <img src="images/wind.png" alt="" />
              <div>
                <p class="Wind">15 km/h</p>
                <p>Wind</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
